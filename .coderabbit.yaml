language: "ko-KR"                      # 리뷰 한국어로 설정
early_access: false                    # 얼리 액세스 기능 끄기

reviews:
  profile: "chill"                     # 리뷰 강도: 너무 빡세게는 하지 않음
  request_changes_workflow: true       # 리뷰 끝나면 자동 PR 승인
  high_level_summary: true             # 리뷰 요약 제공
  poem: false                          # 시적 피드백 포함
  review_status: true                  # 리뷰 상태 표시
  collapse_walkthrough: false          # 리뷰 과정 펼쳐서 보여주기
  auto_review:
    enabled: true                      # 자동 리뷰 활성화
    drafts: false                      # 초안 리뷰는 제외

chat:
  auto_reply: true                     # 자동 응답 기능 활성화
